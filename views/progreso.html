<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoMarket - Widget de Perfil</title>

    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/main.css">
     <link rel="stylesheet" href="../css/progres.css">
</head>
<body>

    <!-- Tarjeta de Perfil de Usuario -->
    <div class="user-card">
        
        <div class="user-header">
            <div class="user-avatar">
                <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=100&q=80" alt="Avatar de Usuario">
            </div>
            <h2 class="user-name">Emily Calderon</h2>
            <p class="user-role">Cliente Consciente</p>
        </div>

    
        <div class="stats-container">
            
            <!-- arboles plantados  -->
            <div class="stat-item">
                <div class="stat-info">
                    <span>Árboles Plantados</span>
                    <span class="stat-value">12 / 15</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" style="width: 80%;"></div>
                </div>
            </div>

            <!--  co2 ahorrados  -->
            <div class="stat-item">
                <div class="stat-info">
                    <span>CO2 Ahorrado</span>
                    <span class="stat-value">145 kg</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" style="width: 45%;"></div>
                </div>
            </div>

            <!-- reciclaje reutilizado -->
            <div class="stat-item">
                <div class="stat-info">
                    <span>Plástico Reciclado</span>
                    <span class="stat-value">95%</span>
                </div>
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" style="width: 95%;"></div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
